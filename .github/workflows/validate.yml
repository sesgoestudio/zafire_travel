name: Validate ZAFIRE static site
on:
  pull_request:
  push:
    branches: [main]
jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript
        run: node scripts/validate-inline-scripts.mjs
